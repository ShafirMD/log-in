<!DOCTYPE html>
<html>
<head>
<title>Login Page - Simple Sky</title>
<!-- style connection -->
<link rel="stylesheet" href="style.css">
</head>
<body>

    <center>
    <div class="login-box">
    <h2>User Login</h2>
    <p class="sub-title">please enter your details to login</p>

    <br>
    <!-- username input -->
    <p class="label-text">Username:</p>
    <input type="text" id="user" placeholder="Enter username...">
    
    <br><br>
    <!-- password input -->
    <p class="label-text">Password:</p>
    <input type="password" id="pass" placeholder="Enter password...">

    <br><br>
    <button onclick="doLogin()">Login Now</button>

    <br><br>
    <!-- forgot link -->
    <a href="#" onclick="alert('Contact Admin!')">Forgot Password?</a>
    </div>
    </center>

    <script>
    // Simple Login logic
    function doLogin() {
        var u = document.getElementById("user").value;
        var p = document.getElementById("pass").value;

        if(u == "" || p == "") {
            alert("Fill all fields first!!!");
        } else {
            alert("Welcome " + u + "! Login Successful.");
        }
    }
    </script>

</body>
</html>
